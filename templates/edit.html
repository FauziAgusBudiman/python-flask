<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Karyawan</title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container form-container">


    <div class="form-card">


        <h1>
            Edit Karyawan
        </h1>


        <p class="subtitle">
            Perbarui informasi karyawan
        </p>



        <form method="POST">


            <div class="form-group">

                <label>
                    Nama Lengkap
                </label>


                <input
                    type="text"
                    name="nama"
                    value="{{ data['nama'] }}"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Email
                </label>


                <input
                    type="email"
                    name="email"
                    value="{{ data['email'] }}"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Jabatan
                </label>


                <input
                    type="text"
                    name="jabatan"
                    value="{{ data['jabatan'] }}"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Departemen
                </label>


                <input
                    type="text"
                    name="departemen"
                    value="{{ data['departemen'] }}"
                    required
                >

            </div>



            <div class="form-actions">


                <a
                    href="{{ url_for('index') }}"
                    class="btn btn-secondary"
                >

                    Kembali

                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    Update Data

                </button>


            </div>


        </form>


    </div>


</div>


</body>

</html>
