<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tambah Karyawan</title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container form-container">


    <div class="form-card">


        <h1>
            Tambah Karyawan
        </h1>


        <p class="subtitle">
            Masukkan informasi karyawan
        </p>



        <form method="POST">


            <div class="form-group">

                <label>
                    Nama Lengkap
                </label>


                <input
                    type="text"
                    name="nama"
                    placeholder="Contoh: Fauzi Agus Budiman"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Email
                </label>


                <input
                    type="email"
                    name="email"
                    placeholder="contoh@email.com"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Jabatan
                </label>


                <input
                    type="text"
                    name="jabatan"
                    placeholder="Contoh: Staff IT"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Departemen
                </label>


                <input
                    type="text"
                    name="departemen"
                    placeholder="Contoh: Information Technology"
                    required
                >

            </div>



            <div class="form-actions">


                <a
                    href="{{ url_for('index') }}"
                    class="btn btn-secondary"
                >

                    Kembali

                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    Simpan Data

                </button>


            </div>


        </form>


    </div>


</div>


</body>

</html>
